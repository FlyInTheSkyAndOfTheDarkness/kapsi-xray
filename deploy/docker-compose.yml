services:
  kaspi-xray:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: kaspi-xray
    restart: unless-stopped
    env_file:
      - ./kaspi-xray.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - kaspi_xray_data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kaspi_xray_data:
