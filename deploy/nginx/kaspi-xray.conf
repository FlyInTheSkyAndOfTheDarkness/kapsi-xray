server {
    listen 80;
    server_name kaspi.example.kz;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold catalog read walks Kaspi page by page — 12 products each,
        # deliberately paced — so a large store can take well over a minute.
        # nginx's 60s default would cut that off and show an empty catalog.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
